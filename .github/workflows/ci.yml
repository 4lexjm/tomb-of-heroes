name: CI Engine Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  validate-specs-and-core:
    name: Lint, Build & Headless Test (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Run Clippy (Strict Zero-Warning)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests (Headless)
        run: cargo test --workspace

      - name: Validate Cross-Compilation (iOS Core target)
        run: |
          rustup target add aarch64-apple-ios
          SDKROOT=/tmp CRATE_CC_NO_DEFAULTS=1 CC_aarch64_apple_ios=gcc AR_aarch64_apple_ios=ar cargo check --target aarch64-apple-ios --package tomb_of_heroes_core

      - name: Validate Cross-Compilation (Android Core target)
        run: |
          rustup target add aarch64-linux-android
          CRATE_CC_NO_DEFAULTS=1 CC_aarch64_linux_android=gcc AR_aarch64_linux_android=ar cargo check --target aarch64-linux-android --package tomb_of_heroes_core
