name: Bump Version & Tag Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type de révision (minor ou patch)'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - patch

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version (Phase de conception : Major=0)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Execute Bump Script
        run: |
          python3 scripts/bump_version.py --type ${{ github.event.inputs.bump_type }}

      - name: Read New Version
        id: get_version
        run: |
          VERSION=$(python3 -c '
          import re
          from pathlib import Path
          content = Path("Cargo.toml").read_text()
          m = re.search(r"\[workspace\.package\][\s\S]*?version\s*=\s*\"([^\"]+)\"", content)
          print(m.group(1))
          ')
          echo "NEW_VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "BUMPED_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Commit and Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/tomb_of_heroes_app/Cargo.toml packaging/ios/Info.plist
          git commit -m "chore(release): bump version to v${{ env.BUMPED_VERSION }} [skip ci]"
          git tag -a "v${{ env.BUMPED_VERSION }}" -m "Release v${{ env.BUMPED_VERSION }}"
          git push origin main --tags
